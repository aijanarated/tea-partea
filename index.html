<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>For Mazonty — 18</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Kalam:wght@400;700&display=swap');

*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
    background:#101214;
    color:#fff;
    font-family:Arial,sans-serif;
}

/* =========================================================
   ROOM
========================================================= */

#room{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    perspective:1100px;
    background:
        radial-gradient(circle at 50% 18%,#f8dfb4 0,#c5b59d 18%,transparent 42%),
        linear-gradient(150deg,#687c80,#a9aaa0 45%,#735f52);
}

#room::after{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:90;
    background:
        radial-gradient(circle,transparent 45%,rgba(0,0,0,.42));
}

/* WALL */

.wall{
    position:absolute;
    inset:0 0 40% 0;
    background:
        linear-gradient(90deg,rgba(255,255,255,.12),transparent 35%,rgba(0,0,0,.12)),
        repeating-linear-gradient(90deg,
            rgba(255,255,255,.025) 0 2px,
            transparent 2px 70px);
}

/* WINDOW */

.window{
    position:absolute;
    left:8%;
    top:8%;
    width:270px;
    height:280px;
    border:12px solid #45443e;
    background:
        linear-gradient(135deg,#dff2f4,#91c4d0 48%,#f5dfb4);
    box-shadow:0 20px 45px rgba(0,0,0,.25);
}

.window:before{
    content:"";
    position:absolute;
    width:8px;
    height:100%;
    left:50%;
    background:#45443e;
}

.window:after{
    content:"";
    position:absolute;
    width:100%;
    height:8px;
    top:50%;
    background:#45443e;
}

/* LIGHTS */

.lights{
    position:absolute;
    top:4%;
    right:8%;
    width:42%;
    display:flex;
    justify-content:space-around;
    z-index:4;
}

.light{
    width:14px;
    height:20px;
    border-radius:50%;
    background:#ffd56b;
    box-shadow:0 0 20px #ffd56b;
    animation:glow 1.8s infinite alternate;
}
.light:nth-child(2){background:#f28ea5;box-shadow:0 0 20px #f28ea5}
.light:nth-child(3){background:#75b8dc;box-shadow:0 0 20px #75b8dc}
.light:nth-child(4){background:#9fca81;box-shadow:0 0 20px #9fca81}
.light:nth-child(5){background:#ffd56b;box-shadow:0 0 20px #ffd56b}

@keyframes glow{
    from{opacity:.55}
    to{opacity:1}
}

/* BANNER */

.banner{
    position:absolute;
    top:12%;
    right:7%;
    z-index:5;
    transform:rotate(2deg);
    white-space:nowrap;
}

.flag{
    display:inline-block;
    padding:13px 15px 18px;
    margin:3px;
    color:#33291f;
    background:#f4c95d;
    clip-path:polygon(0 0,100% 0,100% 82%,50% 100%,0 82%);
    font-weight:bold;
}

.flag:nth-child(even){background:#e891a2}
.flag:nth-child(3n){background:#74a9d0}

/* =========================================================
   PERSON ACROSS TABLE
========================================================= */

.shadowPerson{
    position:absolute;
    z-index:8;
    left:50%;
    top:16%;
    width:260px;
    height:330px;
    transform:translateX(-50%);
    filter:blur(.3px);
}

.head{
    position:absolute;
    left:82px;
    width:96px;
    height:112px;
    border-radius:50%;
    background:radial-gradient(circle at 38% 30%,#48423e,#141313 65%,#080808);
}

.shoulders{
    position:absolute;
    top:93px;
    left:20px;
    width:220px;
    height:190px;
    border-radius:50% 50% 12px 12px;
    background:linear-gradient(110deg,#393331,#111010 60%,#080808);
    box-shadow:0 30px 45px rgba(0,0,0,.4);
}

.chair{
    position:absolute;
    top:73px;
    left:-5px;
    width:270px;
    height:260px;
    border:15px solid rgba(42,38,35,.65);
    border-radius:48% 48% 5% 5%;
    z-index:-1;
}

/* =========================================================
   TABLE
========================================================= */

.table{
    position:absolute;
    z-index:20;
    left:-10%;
    bottom:-30%;
    width:120%;
    height:66%;
    transform:rotateX(55deg);
    transform-origin:bottom;
    background:
        repeating-linear-gradient(
            7deg,
            #966d4d 0 34px,
            #80583e 35px 38px,
            #a87954 39px 70px
        );
    box-shadow:0 -25px 50px rgba(0,0,0,.4);
}

.table:after{
    content:"";
    position:absolute;
    inset:0;
    background:
        repeating-linear-gradient(
            0deg,
            transparent 0 42px,
            rgba(50,25,10,.16) 43px 45px
        );
}

/* =========================================================
   TABLE OBJECTS
========================================================= */

.object{
    position:absolute;
    z-index:30;
}

/* teapot */

#pot{
    left:36%;
    top:25%;
    width:145px;
    height:120px;
    cursor:pointer;
    transition:transform .7s;
}

.potBody{
    position:absolute;
    left:25px;
    top:27px;
    width:100px;
    height:75px;
    border-radius:48%;
    background:
        radial-gradient(circle at 32% 22%,#f0eee8,#aaa9a4 30%,#64615c 72%);
    box-shadow:inset -15px -12px 18px rgba(0,0,0,.35),
               8px 15px 25px rgba(0,0,0,.3);
}

.potLid{
    position:absolute;
    left:40px;
    top:18px;
    width:70px;
    height:20px;
    border-radius:50%;
    background:linear-gradient(#ddd9d0,#73706b);
}

.potKnob{
    position:absolute;
    left:66px;
    top:9px;
    width:17px;
    height:13px;
    border-radius:50%;
    background:#68655f;
}

.handle{
    position:absolute;
    right:0;
    top:34px;
    width:58px;
    height:67px;
    border:12px solid #68655f;
    border-left:0;
    border-radius:0 50% 50% 0;
}

.spout{
    position:absolute;
    left:-18px;
    top:43px;
    width:52px;
    height:30px;
    background:linear-gradient(135deg,#96938d,#4c4944);
    clip-path:polygon(100% 28%,100% 70%,0 100%,25% 50%,0 0);
}

/* glass */

#glass{
    left:54%;
    top:30%;
    width:76px;
    height:118px;
    cursor:pointer;
}

.glass{
    position:absolute;
    inset:0;
    overflow:hidden;
    clip-path:polygon(4% 0,96% 0,83% 100%,17% 100%);
    border:2px solid rgba(255,255,255,.7);
    background:linear-gradient(90deg,
        rgba(255,255,255,.25),
        rgba(255,255,255,.03),
        rgba(255,255,255,.22));
    box-shadow:0 15px 22px rgba(0,0,0,.25);
}

.tea{
    position:absolute;
    bottom:0;
    left:0;
    width:100%;
    height:0;
    background:linear-gradient(90deg,#6c2810,#bd6126,#74300f);
    transition:height 1.7s;
}

.tea:before{
    content:"";
    position:absolute;
    top:-6px;
    left:3%;
    width:94%;
    height:12px;
    border-radius:50%;
    background:#8b3512;
}

.shine{
    position:absolute;
    left:13px;
    top:8%;
    width:7px;
    height:80%;
    border-radius:50%;
    background:linear-gradient(transparent,rgba(255,255,255,.55),transparent);
}

.saucer{
    position:absolute;
    bottom:-7px;
    left:-14px;
    width:105px;
    height:22px;
    border-radius:50%;
    background:radial-gradient(ellipse,#fff,#cbc5b9);
}

/* tea stream */

#stream{
    position:absolute;
    z-index:40;
    left:51%;
    top:38%;
    width:6px;
    height:0;
    opacity:0;
    border-radius:50%;
    background:linear-gradient(#bf672b,#6c2810);
    transition:height 1.2s,opacity .2s;
}

/* steam */

.steam{
    position:absolute;
    z-index:42;
    width:20px;
    height:90px;
    border-left:3px solid rgba(255,255,255,.35);
    border-radius:50%;
    opacity:0;
    filter:blur(2px);
}

.steam.on{
    opacity:1;
    animation:steam 3s infinite ease-in-out;
}

.steam1{left:55%;top:24%}
.steam2{left:59%;top:24%;animation-delay:1s}

@keyframes steam{
    0%{transform:translateY(20px);opacity:0}
    35%{opacity:.45}
    100%{transform:translateY(-75px) rotate(-8deg);opacity:0}
}

/* cake */

.cake{
    position:absolute;
    z-index:31;
    left:18%;
    top:28%;
    width:130px;
    height:72px;
    border-radius:8px 8px 17px 17px;
    background:linear-gradient(#f1a5b4,#d56e84);
    box-shadow:0 14px 20px rgba(0,0,0,.3);
}

.cake:before{
    content:"";
    position:absolute;
    left:0;
    top:-18px;
    width:100%;
    height:30px;
    border-radius:50%;
    background:#fff0e2;
}

.candle{
    position:absolute;
    left:61px;
    top:-52px;
    width:9px;
    height:42px;
    background:repeating-linear-gradient(#fff 0 8px,#e99aaa 8px 13px);
}

.flame{
    position:absolute;
    left:-2px;
    top:-21px;
    width:13px;
    height:21px;
    background:radial-gradient(ellipse at center bottom,#fff 0 18%,#ffc34c 35%,#ed7530 65%,transparent 70%);
    animation:flame .55s infinite alternate;
}

@keyframes flame{
    to{transform:rotate(5deg) scale(1.08)}
}

/* =========================================================
   PHOTOS AS PHYSICAL OBJECTS
========================================================= */

#photo1,#photo2,#photo3{
    position:absolute;
    z-index:35;
    width:155px;
    padding:9px 9px 30px;
    background:#f9f5e9;
    box-shadow:0 15px 25px rgba(0,0,0,.35);
    cursor:pointer;
    transition:.45s;
}

#photo1{
    left:7%;
    top:18%;
    transform:rotate(-7deg);
}

#photo2{
    right:9%;
    top:20%;
    transform:rotate(6deg);
}

#photo3{
    left:24%;
    top:43%;
    transform:rotate(-3deg);
}

.photo img{
    display:block;
    width:100%;
    height:125px;
    object-fit:cover;
    background:#aaa;
}

.photoCaption{
    margin-top:9px;
    color:#30261f;
    text-align:center;
    font-family:Kalam,cursive;
    font-size:14px;
    line-height:1.1;
}

#photo1:hover,#photo2:hover,#photo3:hover{
    transform:translateY(-14px) rotate(0) scale(1.08);
    z-index:70;
}

/* =========================================================
   LETTER OBJECT
========================================================= */

#letterObject{
    position:absolute;
    z-index:50;
    right:27%;
    top:42%;
    width:130px;
    height:80px;
    cursor:pointer;
    transform:rotate(-5deg);
    transition:.6s;
}

.envelope{
    width:100%;
    height:100%;
    background:#f3e3c2;
    box-shadow:0 12px 22px rgba(0,0,0,.35);
    position:relative;
}

.envelope:before{
    content:"";
    position:absolute;
    inset:0;
    background:#ead4aa;
    clip-path:polygon(0 0,50% 52%,100% 0);
}

.seal{
    position:absolute;
    z-index:3;
    left:50%;
    top:43%;
    transform:translate(-50%,-50%);
    width:25px;
    height:25px;
    border-radius:50%;
    background:#bd6c72;
    box-shadow:0 2px 5px rgba(0,0,0,.3);
}

#letterObject.open{
    transform:translateY(-35px) scale(1.1) rotate(0);
}

/* =========================================================
   UI
========================================================= */

#hint{
    position:absolute;
    z-index:100;
    left:50%;
    bottom:7%;
    transform:translateX(-50%);
    text-align:center;
    padding:14px 24px;
    border-radius:30px;
    background:rgba(0,0,0,.4);
    backdrop-filter:blur(10px);
    font-size:13px;
    letter-spacing:.5px;
    transition:opacity .5s;
}

#hint.fade{opacity:0;pointer-events:none}

/* =========================================================
   MODALS
========================================================= */

#modal{
    position:fixed;
    z-index:200;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(5,5,5,.72);
    backdrop-filter:blur(12px);
    padding:20px;
}

#modal.show{display:flex}

.modalBox{
    position:relative;
    max-width:700px;
    width:95%;
    max-height:90vh;
    overflow:auto;
    padding:25px;
    background:#f7eedb;
    color:#30251e;
    box-shadow:0 30px 90px rgba(0,0,0,.55);
}

.modalBox img{
    display:block;
    max-width:100%;
    max-height:65vh;
    margin:auto;
    object-fit:contain;
}

.modalCaption{
    font-family:Kalam,cursive;
    text-align:center;
    font-size:22px;
    margin-top:16px;
}

.close{
    position:absolute;
    right:14px;
    top:10px;
    border:0;
    background:none;
    font-size:28px;
    cursor:pointer;
    color:#332a25;
}

/* letter */

.letterPaper{
    padding:55px;
    background:
        repeating-linear-gradient(
            0deg,
            #fff8e8 0 31px,
            #efe1c5 32px
        );
    box-shadow:0 25px 70px rgba(0,0,0,.4);
}

.letterPaper h1{
    font-family:"DM Serif Display",serif;
    font-weight:400;
    font-size:48px;
    margin:0 0 30px;
}

.letterText{
    white-space:pre-line;
    font-family:Kalam,cursive;
    font-size:20px;
    line-height:2;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

    .window{
        width:190px;
        height:210px;
    }

    .banner{
        right:2%;
        top:10%;
        transform:scale(.65) rotate(2deg);
        transform-origin:right;
    }

    .shadowPerson{
        transform:translateX(-50%) scale(.72);
        top:14%;
    }

    #pot{
        left:23%;
        top:29%;
        transform:scale(.8);
    }

    #glass{
        left:58%;
        top:34%;
        transform:scale(.8);
    }

    .cake{
        left:9%;
        top:31%;
        transform:scale(.75);
    }

    #photo1{
        left:3%;
        top:22%;
        transform:scale(.7) rotate(-7deg);
    }

    #photo2{
        right:2%;
        top:23%;
        transform:scale(.7) rotate(6deg);
    }

    #photo3{
        left:17%;
        top:47%;
        transform:scale(.7) rotate(-3deg);
    }

    #letterObject{
        right:8%;
        top:48%;
        transform:scale(.75) rotate(-5deg);
    }

    #hint{
        width:85%;
        font-size:12px;
    }

    .letterPaper{
        padding:30px;
    }

    .letterPaper h1{
        font-size:38px;
    }

    .letterText{
        font-size:17px;
    }
}
</style>
</head>

<body>

<div id="room">

    <div class="wall"></div>

    <div class="window"></div>

    <div class="lights">
        <div class="light"></div>
        <div class="light"></div>
        <div class="light"></div>
        <div class="light"></div>
        <div class="light"></div>
    </div>

    <div class="banner">
        <span class="flag">H</span>
        <span class="flag">A</span>
        <span class="flag">P</span>
        <span class="flag">P</span>
        <span class="flag">Y</span>
        <span class="flag">1</span>
        <span class="flag">8</span>
    </div>


    <!-- PERSON SITTING OPPOSITE -->

    <div class="shadowPerson">
        <div class="chair"></div>
        <div class="head"></div>
        <div class="shoulders"></div>
    </div>


    <!-- TABLE -->

    <div class="table">

        <div class="cake">
            <div class="candle">
                <div class="flame"></div>
            </div>
        </div>


        <!-- TEAPOT -->

        <div id="pot" class="object" onclick="pourTea()">

            <div class="potLid"></div>
            <div class="potKnob"></div>
            <div class="handle"></div>
            <div class="spout"></div>
            <div class="potBody"></div>

        </div>


        <!-- TEA GLASS -->

        <div id="glass" class="object" onclick="pourTea()">

            <div class="glass">

                <div id="tea" class="tea"></div>

                <div class="shine"></div>

            </div>

            <div class="saucer"></div>

        </div>


        <div id="stream"></div>

        <div class="steam steam1" id="steam1"></div>
        <div class="steam steam2" id="steam2"></div>


        <!-- PHYSICAL PHOTOS -->

        <div id="photo1" class="photo" onclick="openPhoto(1)">

            <img src="photo1.jpg">

            <div class="photoCaption">
                where did this sweet baby boy go?
            </div>

        </div>


        <div id="photo2" class="photo" onclick="openPhoto(2)">

            <img src="photo2.jpg">

            <div class="photoCaption">
                the cutest femboy ever
            </div>

        </div>


        <div id="photo3" class="photo" onclick="openPhoto(3)">

            <img src="photo3.jpg">

            <div class="photoCaption">
                we look so good (i look better ofc)<br>
                My fav day btw
            </div>

        </div>


        <!-- LETTER -->

        <div id="letterObject"
             onclick="openLetter()">

            <div class="envelope">
                <div class="seal"></div>
            </div>

        </div>

    </div>


    <div id="hint">
        It's your birthday. Click around.
    </div>

</div>


<!-- MODAL -->

<div id="modal">

    <div class="modalBox">

        <button class="close"
                onclick="closeModal()">
            ×
        </button>

        <div id="modalContent"></div>

    </div>

</div>


<script>

let poured = false;


/* =========================================================
   TEA
========================================================= */

function pourTea(){

    if(poured) return;

    poured = true;

    const pot =
        document.getElementById("pot");

    const stream =
        document.getElementById("stream");

    const tea =
        document.getElementById("tea");

    const steam1 =
        document.getElementById("steam1");

    const steam2 =
        document.getElementById("steam2");

    pot.style.transform =
        "rotate(-18deg) translateY(-10px)";

    stream.style.opacity = "1";
    stream.style.height = "100px";

    setTimeout(()=>{
        tea.style.height = "70%";
    },300);

    setTimeout(()=>{
        steam1.classList.add("on");
        steam2.classList.add("on");
    },700);

    setTimeout(()=>{
        stream.style.opacity = "0";
        stream.style.height = "0";
        pot.style.transform = "rotate(0)";
    },2300);

    document.getElementById("hint").textContent =
        "Okay. Now look around the table.";

    document.getElementById("hint").classList.add("fade");
}


/* =========================================================
   PHOTOS
========================================================= */

const captions = {
    1:"where did this sweet baby boy go?",
    2:"the cutest femboy ever",
    3:"we look so good (i look better ofc)<br>My fav day btw"
};

function openPhoto(number){

    const modal =
        document.getElementById("modal");

    const content =
        document.getElementById("modalContent");

    content.innerHTML = `
        <img src="photo${number}.jpg">
        <div class="modalCaption">
            ${captions[number]}
        </div>
    `;

    modal.classList.add("show");
}


/* =========================================================
   LETTER
========================================================= */

function openLetter(){

    const envelope =
        document.getElementById("letterObject");

    envelope.classList.add("open");

    setTimeout(()=>{

        const modal =
            document.getElementById("modal");

        const content =
            document.getElementById("modalContent");

        content.innerHTML = `
            <div class="letterPaper">

                <h1>hey mazonty.</h1>

                <div class="letterText">hey mazonty, so this is awkward but happy birthdayyy
Ugh wtvrr. first of all, don't think i'm not mad at cuz i am but wtvr 
 anyways i love so much or wtvr and i miss you even more u r a decent person and you deserve decent things 
i hope 18 treats u well and u get the car license u want (and ofc the 100% in qudurat) anyways i love you much baby</div>

            </div>
        `;

        modal.classList.add("show");

    },450);
}


/* =========================================================
   CLOSE
========================================================= */

function closeModal(){

    document
        .getElementById("modal")
        .classList.remove("show");

}


/* =========================================================
   CLICK OUTSIDE
========================================================= */

document
    .getElementById("modal")
    .addEventListener("click",function(e){

        if(e.target === this){
            closeModal();
        }

    });


/* =========================================================
   SMALL CAMERA MOVEMENT
========================================================= */

document.addEventListener("mousemove",e=>{

    if(window.innerWidth < 700) return;

    const x =
        (e.clientX/window.innerWidth-.5);

    const y =
        (e.clientY/window.innerHeight-.5);

    const person =
        document.querySelector(".shadowPerson");

    person.style.transform =
        `translateX(calc(-50% + ${x*14}px))
         translateY(${y*8}px)`;

});


/* =========================================================
   RANDOM CONFETTI-LIKE DUST
========================================================= */

for(let i=0;i<35;i++){

    const p =
        document.createElement("div");

    p.style.position="absolute";
    p.style.zIndex="60";
    p.style.pointerEvents="none";

    p.style.left=Math.random()*100+"%";
    p.style.top=Math.random()*55+"%";

    p.style.width=(Math.random()*5+2)+"px";
    p.style.height=(Math.random()*9+3)+"px";

    const colors=[
        "#f3c95d",
        "#e891a2",
        "#72a9d1",
        "#94bc7c",
        "#fff0d0"
    ];

    p.style.background=
        colors[Math.floor(Math.random()*colors.length)];

    p.style.transform=
        `rotate(${Math.random()*360}deg)`;

    p.style.opacity=.35+Math.random()*.6;

    p.animate(
        [
            {transform:p.style.transform},
            {transform:
                `translateY(${20+Math.random()*40}px)
                 rotate(${Math.random()*720}deg)`
            }
        ],
        {
            duration:3000+Math.random()*4000,
            iterations:Infinity,
            direction:"alternate"
        }
    );

    document
        .getElementById("room")
        .appendChild(p);
}

</script>

</body>
</html>
