<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mazonty.exe 🎂</title>

<style>
/* =========================================================
   BASIC
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:
        "Trebuchet MS",
        Arial,
        sans-serif;

    background:#26352f;
    color:#fff8ec;
}


/* =========================================================
   MAIN WORLD
========================================================= */

#world{
    position:relative;

    width:100vw;
    height:100vh;

    overflow:hidden;

    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(245,202,120,.16),
            transparent 32%
        ),
        linear-gradient(
            135deg,
            #31473f 0%,
            #24352f 55%,
            #1d2926 100%
        );
}


/* subtle texture */

#world::before{
    content:"";

    position:absolute;
    inset:0;

    pointer-events:none;

    opacity:.12;

    background-image:
        radial-gradient(#fff 1px,transparent 1px);

    background-size:23px 23px;
}


/* =========================================================
   TOP BAR
========================================================= */

.topbar{
    position:absolute;

    top:18px;
    left:20px;
    right:20px;

    z-index:100;

    display:flex;
    align-items:center;
    justify-content:space-between;

    pointer-events:none;
}

.logo{
    pointer-events:auto;

    padding:9px 14px;

    border-radius:13px;

    background:#fff1d6;
    color:#27352f;

    font-weight:900;
    font-size:14px;

    box-shadow:
        4px 5px 0 rgba(0,0,0,.18);

    transform:rotate(-2deg);
}

.nav{
    display:flex;
    gap:7px;

    pointer-events:auto;
}

.nav button{
    border:0;

    padding:9px 13px;

    border-radius:20px;

    cursor:pointer;

    background:rgba(255,255,255,.13);
    color:#fff8ec;

    backdrop-filter:blur(10px);

    transition:.2s;
}

.nav button:hover{
    background:#f0bd67;
    color:#27352f;

    transform:translateY(-2px);
}


/* =========================================================
   MAIN TITLE
========================================================= */

.title{
    position:absolute;

    left:50%;
    top:12%;

    transform:translateX(-50%);

    z-index:10;

    text-align:center;

    pointer-events:none;

    width:90%;
}

.title .tiny{
    font-size:10px;

    letter-spacing:4px;

    text-transform:uppercase;

    opacity:.65;
}

.title h1{
    margin-top:7px;

    font-family:
        "Arial Rounded MT Bold",
        Arial,
        sans-serif;

    font-size:
        clamp(42px,7vw,88px);

    line-height:.9;

    color:#fff2d8;

    text-shadow:
        5px 6px 0 #bf6d61;

    transform:rotate(-2deg);
}

.title p{
    margin-top:12px;

    font-size:13px;

    opacity:.75;
}


/* =========================================================
   DECORATIONS
========================================================= */

.balloon{
    position:absolute;

    width:38px;
    height:48px;

    border-radius:
        50% 50% 47% 47%;

    z-index:3;

    cursor:pointer;

    animation:
        float 4s ease-in-out infinite;

    transition:.2s;
}

.balloon:hover{
    scale:1.15;
}

.balloon::after{
    content:"";

    position:absolute;

    width:1px;
    height:80px;

    background:rgba(255,255,255,.35);

    top:46px;
    left:50%;
}

.balloon.a{
    left:7%;
    top:19%;

    background:#e89191;

    transform:rotate(-8deg);
}

.balloon.b{
    right:8%;
    top:18%;

    background:#e8bf69;

    animation-delay:1s;
}

.balloon.c{
    right:17%;
    bottom:10%;

    background:#82a9c4;

    animation-delay:1.8s;
}

@keyframes float{
    50%{
        transform:
            translateY(-14px)
            rotate(4deg);
    }
}


/* =========================================================
   TABLE / DESK BASE
========================================================= */

.desk{
    position:absolute;

    left:50%;
    bottom:-5%;

    transform:translateX(-50%);

    width:min(1100px,94vw);
    height:45vh;

    background:
        linear-gradient(
            135deg,
            #7a5540,
            #51382e
        );

    border-radius:
        35px 35px 0 0;

    box-shadow:
        0 -15px 50px rgba(0,0,0,.22);

    border-top:
        5px solid #9b7052;
}


/* =========================================================
   TEA
========================================================= */

.tea{
    position:absolute;

    left:50%;
    top:43%;

    transform:
        translate(-50%,-50%);

    width:170px;
    height:115px;

    cursor:pointer;

    z-index:20;

    transition:
        transform .3s;
}

.tea:hover{
    transform:
        translate(-50%,-50%)
        rotate(-3deg)
        scale(1.05);
}


/* cup */

.cup{
    position:absolute;

    left:25px;
    bottom:5px;

    width:120px;
    height:72px;

    border-radius:
        0 0 45px 45px;

    background:
        linear-gradient(
            90deg,
            #fff4dc,
            #e8d1b0
        );

    box-shadow:
        0 12px 15px rgba(0,0,0,.25);
}


/* tea inside */

.cup::before{
    content:"";

    position:absolute;

    left:10px;
    top:-8px;

    width:100px;
    height:23px;

    border-radius:50%;

    background:#7b4932;

    border:
        5px solid #f3dfbd;
}


/* handle */

.handle{
    position:absolute;

    right:3px;
    bottom:24px;

    width:42px;
    height:40px;

    border:
        9px solid #ecd9b9;

    border-left:0;

    border-radius:
        0 50% 50% 0;
}


/* steam */

.steam{
    position:absolute;

    bottom:75px;

    width:24px;
    height:70px;

    border-left:
        3px solid rgba(255,255,255,.18);

    border-radius:50%;

    filter:blur(1px);

    animation:
        steam 3s infinite ease-in-out;
}

.steam.s1{
    left:55px;
}

.steam.s2{
    left:90px;
    animation-delay:1s;
}

@keyframes steam{
    0%,100%{
        opacity:.1;
        transform:translateY(10px) rotate(5deg);
    }

    50%{
        opacity:.6;
        transform:translateY(-15px) rotate(-7deg);
    }
}


/* =========================================================
   PHOTOS
========================================================= */

.photo{
    position:absolute;

    z-index:30;

    cursor:pointer;

    padding:8px 8px 30px;

    background:#fff7e9;

    box-shadow:
        0 14px 25px rgba(0,0,0,.25);

    transition:
        transform .35s,
        box-shadow .35s;
}


/*
IMPORTANT:
The image has NO fixed height.
It uses width:auto / height:auto,
so the whole original photo remains visible.
*/

.photo img{
    display:block;

    width:auto;
    height:auto;

    max-width:260px;
    max-height:230px;

    object-fit:contain;
}

.photo:hover{
    transform:
        translateY(-12px)
        rotate(0deg)
        scale(1.05);

    box-shadow:
        0 25px 45px rgba(0,0,0,.35);

    z-index:80;
}

.photo .caption{
    position:absolute;

    left:0;
    right:0;
    bottom:7px;

    text-align:center;

    color:#40372f;

    font-family:
        "Comic Sans MS",
        cursive;

    font-size:13px;
}


/* photo positions */

.photo1{
    left:8%;
    bottom:22%;

    transform:rotate(-8deg);
}

.photo2{
    right:8%;
    bottom:25%;

    transform:rotate(7deg);
}

.photo3{
    left:30%;
    bottom:4%;

    transform:rotate(-3deg);
}


/* =========================================================
   LETTER
========================================================= */

.letter{
    position:absolute;

    right:25%;
    bottom:9%;

    width:120px;
    height:85px;

    z-index:40;

    cursor:pointer;

    transform:rotate(5deg);

    transition:.3s;
}

.letter:hover{
    transform:
        rotate(0)
        translateY(-10px)
        scale(1.08);
}


/* envelope */

.envelope{
    position:absolute;

    inset:0;

    background:#f2d29d;

    border-radius:5px;

    box-shadow:
        0 12px 20px rgba(0,0,0,.25);
}

.envelope::before{
    content:"";

    position:absolute;

    inset:0;

    clip-path:
        polygon(0 0,50% 55%,100% 0);

    background:#e5bc82;
}

.heart{
    position:absolute;

    left:50%;
    top:48%;

    transform:translate(-50%,-50%);

    color:#c96f6d;

    font-size:22px;

    z-index:2;
}


/* =========================================================
   GIFT
========================================================= */

.gift{
    position:absolute;

    left:20%;
    bottom:10%;

    width:90px;
    height:75px;

    z-index:35;

    cursor:pointer;

    transition:.3s;
}

.gift:hover{
    transform:
        translateY(-12px)
        rotate(-5deg);
}

.giftBox{
    position:absolute;

    bottom:0;

    width:90px;
    height:60px;

    background:#d87b78;

    border-radius:5px;

    box-shadow:
        0 10px 20px rgba(0,0,0,.25);
}

.giftBox::before{
    content:"";

    position:absolute;

    left:37px;

    width:16px;
    height:60px;

    background:#f0c765;
}

.giftLid{
    position:absolute;

    top:3px;

    width:98px;
    height:18px;

    left:-4px;

    background:#e88b85;

    border-radius:5px;

    z-index:2;
}

.bow{
    position:absolute;

    left:31px;
    top:-20px;

    font-size:30px;

    z-index:5;
}


/* =========================================================
   SMALL STICKY NOTE
========================================================= */

.note{
    position:absolute;

    left:42%;
    bottom:20%;

    z-index:25;

    width:145px;

    padding:17px;

    background:#f0cf71;

    color:#393029;

    font-family:
        "Comic Sans MS",
        cursive;

    font-size:12px;

    line-height:1.5;

    transform:rotate(-7deg);

    box-shadow:
        0 10px 20px rgba(0,0,0,.2);
}


/* =========================================================
   POPUP SYSTEM
========================================================= */

.overlay{
    position:fixed;

    inset:0;

    z-index:500;

    display:none;

    align-items:center;
    justify-content:center;

    background:
        rgba(15,20,18,.72);

    backdrop-filter:blur(12px);

    padding:20px;
}

.overlay.active{
    display:flex;
}

.popup{
    position:relative;

    width:min(650px,94vw);

    max-height:88vh;

    overflow:auto;

    background:#fff1d8;

    color:#342c27;

    border-radius:22px;

    padding:35px;

    box-shadow:
        0 35px 90px rgba(0,0,0,.45);

    animation:
        popupIn .35s cubic-bezier(.16,1,.3,1);
}

@keyframes popupIn{
    from{
        opacity:0;
        transform:
            scale(.8)
            rotate(-3deg);
    }

    to{
        opacity:1;
        transform:
            scale(1)
            rotate(0);
    }
}

.close{
    position:absolute;

    right:15px;
    top:12px;

    border:0;

    background:#e8b2a5;

    color:#fff;

    width:32px;
    height:32px;

    border-radius:50%;

    cursor:pointer;

    font-size:20px;
}

.popup h2{
    font-size:30px;

    margin-bottom:20px;
}

.popup p{
    line-height:1.8;

    white-space:pre-line;
}

.popupPhoto{
    width:100%;
    max-height:70vh;

    object-fit:contain;

    display:block;

    margin:auto;

    border-radius:12px;
}


/* =========================================================
   HIDDEN INTERACTION MESSAGE
========================================================= */

#toast{
    position:fixed;

    z-index:1000;

    left:50%;
    bottom:30px;

    transform:
        translate(-50%,30px);

    opacity:0;

    pointer-events:none;

    background:#fff1d8;

    color:#342c27;

    padding:12px 18px;

    border-radius:30px;

    font-size:13px;

    box-shadow:
        0 10px 30px rgba(0,0,0,.25);

    transition:.35s;
}

#toast.show{
    opacity:1;

    transform:
        translate(-50%,0);
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

    .nav button{
        padding:8px;

        font-size:11px;
    }

    .nav button:nth-child(2),
    .nav button:nth-child(3){
        display:none;
    }

    .photo img{
        max-width:150px;
        max-height:150px;
    }

    .photo1{
        left:2%;
        bottom:23%;
    }

    .photo2{
        right:2%;
        bottom:25%;
    }

    .photo3{
        left:27%;
        bottom:4%;
    }

    .photo .caption{
        font-size:9px;
    }

    .gift{
        left:10%;
        bottom:8%;
        transform:scale(.75);
    }

    .letter{
        right:8%;
        bottom:8%;
        transform:scale(.75);
    }

    .note{
        display:none;
    }

    .tea{
        transform:
            translate(-50%,-50%)
            scale(.8);
    }

    .title{
        top:13%;
    }

}
</style>
</head>


<body>

<div id="world">

    <!-- =====================================================
         TOP
    ====================================================== -->

    <div class="topbar">

        <div class="logo">
            mazonty.exe 🎂
        </div>

        <div class="nav">

            <button onclick="showAbout()">
                what is this?
            </button>

            <button onclick="makeConfetti()">
                🎉 chaos
            </button>

            <button onclick="toast('yes, the tea is important. 🫖')">
                🫖
            </button>

        </div>

    </div>


    <!-- =====================================================
         TITLE
    ====================================================== -->

    <div class="title">

        <div class="tiny">
            august 18 · birthday edition
        </div>

        <h1>
            HAPPY 18TH
        </h1>

        <p>
            mazonty, unfortunately, this website is about you.
        </p>

    </div>


    <!-- =====================================================
         BALLOONS
    ====================================================== -->

    <div
        class="balloon a"
        onclick="popBalloon(this)"
    ></div>

    <div
        class="balloon b"
        onclick="popBalloon(this)"
    ></div>

    <div
        class="balloon c"
        onclick="popBalloon(this)"
    ></div>


    <!-- =====================================================
         DESK
    ====================================================== -->

    <div class="desk"></div>


    <!-- =====================================================
         TEA
    ====================================================== -->

    <div
        class="tea"
        onclick="teaMessage()"
        title="click the tea"
    >

        <div class="steam s1"></div>
        <div class="steam s2"></div>

        <div class="handle"></div>

        <div class="cup"></div>

    </div>


    <!-- =====================================================
         PHOTO 1
    ====================================================== -->

    <div
        class="photo photo1"
        onclick="openPhoto('photo1.jpg','where did this sweet baby boy go?')"
    >

        <img src="photo1.jpg">

        <div class="caption">
            where did this sweet baby boy go?
        </div>

    </div>


    <!-- =====================================================
         PHOTO 2
    ====================================================== -->

    <div
        class="photo photo2"
        onclick="openPhoto('photo2.jpg','the cutest femboy ever')"
    >

        <img src="photo2.jpg">

        <div class="caption">
            the cutest femboy ever
        </div>

    </div>


    <!-- =====================================================
         PHOTO 3
    ====================================================== -->

    <div
        class="photo photo3"
        onclick="openPhoto(
            'photo3.jpg',
            'we look so good (i look better ofc) My fav day btw'
        )"
    >

        <img src="photo3.jpg">

        <div class="caption">
            we look so good<br>
            (i look better ofc)<br>
            My fav day btw
        </div>

    </div>


    <!-- =====================================================
         GIFT
    ====================================================== -->

    <div
        class="gift"
        onclick="openGift()"
        title="open me"
    >

        <div class="bow">
            🎀
        </div>

        <div class="giftLid"></div>

        <div class="giftBox"></div>

    </div>


    <!-- =====================================================
         LETTER
    ====================================================== -->

    <div
        class="letter"
        onclick="openLetter()"
        title="open me"
    >

        <div class="envelope"></div>

        <div class="heart">
            ♥
        </div>

    </div>


    <!-- =====================================================
         NOTE
    ====================================================== -->

    <div class="note">

        IMPORTANT:

        <br><br>

        you're 18 now.

        <br>

        please act accordingly.

    </div>

</div>


<!-- =========================================================
     POPUP
========================================================= -->

<div
    class="overlay"
    id="overlay"
    onclick="outsideClose(event)"
>

    <div class="popup">

        <button
            class="close"
            onclick="closePopup()"
        >
            ×
        </button>

        <div id="popupContent"></div>

    </div>

</div>


<div id="toast"></div>


<script>

/* =========================================================
   POPUP
========================================================= */

const overlay =
    document.getElementById("overlay");

const popupContent =
    document.getElementById("popupContent");


function openPopup(html){

    popupContent.innerHTML = html;

    overlay.classList.add("active");

}


function closePopup(){

    overlay.classList.remove("active");

}


function outsideClose(e){

    if(e.target === overlay){

        closePopup();

    }

}


/* =========================================================
   ABOUT
========================================================= */

function showAbout(){

    openPopup(`

        <h2>
            what is this 😭
        </h2>

        <p>
            First of all, happy birthday.

            <br><br>

            Second of all, don't get too excited.

            <br><br>

            I made you an entire website because apparently
            a normal "happy birthday" message wasn't enough.

            <br><br>

            There are things to click.

            There are photos.

            There's tea.

            There's a letter.

            There's unnecessary chaos.

            <br><br>

            Basically, explore.
        </p>

    `);

}


/* =========================================================
   LETTER
========================================================= */

function openLetter(){

    openPopup(`

        <h2>
            hey mazonty,
        </h2>

        <p>
hey mazonty, so this is awkward but happy birthdayyy
Ugh wtvrr. first of all, don't think i'm not mad at cuz i am but wtvr 
 anyways i love so much or wtvr and i miss you even more u r a decent person and you deserve decent things 
i hope 18 treats u well and u get the car license u want (and ofc the 100% in qudurat) anyways i love you much baby
        </p>

    `);

}


/* =========================================================
   GIFT
========================================================= */

function openGift(){

    makeConfetti();

    openPopup(`

        <h2>
            you opened it 🎁
        </h2>

        <p>
            Congratulations.

            <br><br>

            Your present is...

            <br><br>

            ✨ absolutely nothing ✨

            <br><br>

            Okay fine.

            Your actual present is the fact that I spent
            time making this ridiculous website.

            <br><br>

            Happy birthday, loser.
        </p>

    `);

}


/* =========================================================
   TEA
========================================================= */

function teaMessage(){

    toast(
        "your tea has been successfully poured 🫖"
    );

}


/* =========================================================
   PHOTOS
========================================================= */

function openPhoto(image,caption){

    openPopup(`

        <img
            class="popupPhoto"
            src="${image}"
            alt="birthday photo"
        >

        <br>

        <p style="
            text-align:center;
            font-family:'Comic Sans MS',cursive;
            font-size:18px;
        ">
            ${caption}
        </p>

    `);

}


/* =========================================================
   TOAST
========================================================= */

let toastTimer;

function toast(message){

    const element =
        document.getElementById("toast");

    element.textContent =
        message;

    element.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer =
        setTimeout(()=>{

            element.classList.remove("show");

        },2200);

}


/* =========================================================
   BALLOONS
========================================================= */

function popBalloon(balloon){

    balloon.style.transition =
        "transform .2s, opacity .2s";

    balloon.style.transform =
        "scale(1.7)";

    balloon.style.opacity =
        "0";

    makeSmallConfetti(
        balloon.getBoundingClientRect().left,
        balloon.getBoundingClientRect().top
    );

    setTimeout(()=>{

        balloon.remove();

    },200);

}


/* =========================================================
   CONFETTI
========================================================= */

function makeSmallConfetti(x,y){

    for(let i=0;i<18;i++){

        const piece =
            document.createElement("div");

        piece.style.position =
            "fixed";

        piece.style.left =
            x+"px";

        piece.style.top =
            y+"px";

        piece.style.width =
            "7px";

        piece.style.height =
            "11px";

        piece.style.zIndex =
            "1000";

        piece.style.pointerEvents =
            "none";

        piece.style.background =
            [
                "#e89191",
                "#e8bf69",
                "#82a9c4",
                "#fff1d8"
            ][
                Math.floor(
                    Math.random()*4
                )
            ];

        document.body.appendChild(piece);

        const angle =
            Math.random()*Math.PI*2;

        const distance =
            40+Math.random()*100;

        const endX =
            Math.cos(angle)*distance;

        const endY =
            Math.sin(angle)*distance+100;

        piece.animate(

            [
                {
                    transform:"translate(0,0) rotate(0)",
                    opacity:1
                },
                {
                    transform:
                        `translate(${endX}px,${endY}px)
                         rotate(500deg)`,

                    opacity:0
                }
            ],

            {
                duration:
                    700+Math.random()*500,

                easing:"cubic-bezier(.2,.8,.3,1)"
            }

        ).onfinish=()=>piece.remove();

    }

}


function makeConfetti(){

    for(let i=0;i<80;i++){

        const piece =
            document.createElement("div");

        piece.style.position =
            "fixed";

        piece.style.left =
            Math.random()*100+"vw";

        piece.style.top =
            "-20px";

        piece.style.width =
            "8px";

        piece.style.height =
            "13px";

        piece.style.zIndex =
            "900";

        piece.style.pointerEvents =
            "none";

        piece.style.background =
            [
                "#e89191",
                "#e8bf69",
                "#82a9c4",
                "#8eaa83",
                "#fff1d8"
            ][
                Math.floor(
                    Math.random()*5
                )
            ];

        document.body.appendChild(piece);

        const rotation =
            Math.random()*900-450;

        piece.animate(

            [
                {
                    transform:
                        `translateY(0) rotate(0deg)`,
                    opacity:1
                },
                {
                    transform:
                        `translateY(110vh)
                         rotate(${rotation}deg)`,
                    opacity:.7
                }
            ],

            {
                duration:
                    2500+Math.random()*3000,

                delay:
                    Math.random()*800,

                easing:"linear"
            }

        ).onfinish=()=>piece.remove();

    }

}


/* =========================================================
   KEYBOARD ESCAPE
========================================================= */

document.addEventListener(
    "keydown",
    event=>{

        if(event.key === "Escape"){

            closePopup();

        }

    }
);

</script>

</html>
